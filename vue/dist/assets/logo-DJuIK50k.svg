<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 笔记本外框 -->
  <rect x="12" y="8" width="40" height="48" rx="3" fill="url(#blueGradient)" />
  
  <!-- 笔记本内页（白色） -->
  <rect x="16" y="12" width="32" height="40" rx="2" fill="white" opacity="0.95" />
  
  <!-- 笔记本线条 -->
  <line x1="20" y1="20" x2="44" y2="20" stroke="#667eea" stroke-width="1.5" stroke-linecap="round" />
  <line x1="20" y1="26" x2="44" y2="26" stroke="#667eea" stroke-width="1.5" stroke-linecap="round" />
  <line x1="20" y1="32" x2="38" y2="32" stroke="#667eea" stroke-width="1.5" stroke-linecap="round" />
  <line x1="20" y1="38" x2="42" y2="38" stroke="#667eea" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- 笔记本装订线 -->
  <line x1="24" y1="8" x2="24" y2="56" stroke="white" stroke-width="1" opacity="0.4" />
  
  <!-- 珊瑚/树枝装饰元素（右下角） -->
  <g transform="translate(38, 42)" opacity="0.8">
    <path d="M 0,0 Q 2,-3 4,-2 Q 6,-1 5,1" stroke="#f093fb" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M 4,-2 Q 6,-4 8,-3" stroke="#f093fb" stroke-width="1.2" fill="none" stroke-linecap="round" />
    <circle cx="5" cy="1" r="1" fill="#fa709a" />
    <circle cx="8" cy="-3" r="0.8" fill="#fa709a" />
  </g>
</svg>
